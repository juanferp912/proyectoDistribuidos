services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_boloneria
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      DB_HOST:     ${DB_HOST}
      DB_PORT:     ${DB_PORT}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME}
      APP_PORT:    ${APP_PORT}
    networks:
      - red_app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL:    http://${MY_TAILSCALE_IP}:${APP_PORT}
        VITE_N8N_URL:    ${N8N_URL}
        VITE_N8N_WEBHOOK: ${N8N_WEBHOOK}
    container_name: ui_boloneria
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - red_app

networks:
  red_app:
    driver: bridge
